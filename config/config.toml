
[paths]

# NOTE: Use single quotes, NOT double quotes, to specify paths below!

# REQUIRED: working/temporary directory for generated files
# NOTE: files located here may be deleted by the script at any moment!
working_dir = 'E:\Temp\Witcher3Modding\work'

# Optional: game directory to use when installing mod builds and launching the game (--install, --launch)
game_path = 'D:\Games\The Witcher 3 Remastered'



##########################################################################################
### The configuration below is only relevant for building Smooth UI Remastered itself, ###
### not for other mod authors building compatibility patches.                          ###
##########################################################################################


# Folder that holds the uncooked game files.
uncooked_files = 'E:\Temp\Witcher3Modding\RemasteredUncooked5.01'

# w3stringsr.exe, which encodes the settings menu's strings
# https://www.nexusmods.com/witcher3/mods/13094
w3stringsr = 'E:\Temp\Witcher3Modding\Tools\w3stringsr.exe'

# Version information of the Smooth UI Remastered mod that is created.
[versions]
created_mod_version = "v0.3.3dev"
targeted_game_version = "5.01"

# The tools' version (X.Y.Z), which its exes and the packages it builds carry (see build-tools.py)
tools_version = "0.9.0"
